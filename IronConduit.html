<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>IRON CONDUIT – original 80s-style run & gun</title>
<style>
  html,body{margin:0;height:100%;background:#05060a;overflow:hidden;overscroll-behavior:none;
    touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  body{display:flex;align-items:center;justify-content:center}
  #wrap{position:relative;width:min(100vw,72vh);width:min(100vw,75dvh);aspect-ratio:3/4}
  canvas{width:100%;height:100%;display:block;image-rendering:pixelated;background:#000;cursor:crosshair;touch-action:none}
  #scan{position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(to bottom,rgba(0,0,0,.28) 0 1px,transparent 1px 3px);
    box-shadow:inset 0 0 90px rgba(0,0,0,.85);animation:flick 4s infinite}
  @keyframes flick{0%,100%{opacity:.9}50%{opacity:1}}
</style>
</head>
<body>
<div id="wrap"><canvas id="g" width="480" height="640"></canvas><div id="scan"></div></div>
<script>
'use strict';
/* ================== CORE ================== */
const cv=document.getElementById('g'),ctx=cv.getContext('2d');
const W=480,H=640,BOSS_AT=6000;
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const overlap=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function hash(x,y){let h=(Math.imul(x,374761393)+Math.imul(y,668265263))|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296;}
function circRect(cx,cy,r,o){const nx=clamp(cx,o.x,o.x+o.w),ny=clamp(cy,o.y,o.y+o.h);return(cx-nx)**2+(cy-ny)**2<r*r;}

/* ================== STATE ================== */
let state='title',frame=0,endF=0,P,bul,ebul,foes,crates,walls,pick,gren,parts;
let camY=0,genY=0,score=0,shake=0,boss=null,bossSpawned=false,spawnT=0,msgTxt='',msgT=0,winT=0,hi=0;
try{hi=+localStorage.getItem('ic_hi')||0;}catch(e){}
const WEAPONS={RIFLE:{rate:7},SPREAD:{rate:11},FLAME:{rate:3},OVERCHARGE:{rate:5}};
const PK={C:['#f0f','◆'],S:['#6ff','S'],F:['#f80','F'],G:['#9f6','G'],L:['#ff6','1UP']};
const lvl=()=>clamp(-camY/BOSS_AT,0,1);
const canRestart=()=>state==='title'||frame-endF>60;

/* ================== AUDIO ================== */
let AC=null;
function unlockAudio(){
  if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(AC&&AC.state==='suspended')AC.resume();
}
function sfx(f,d=.08,type='square',v=.05,slide=0){
  if(!AC||AC.state!=='running')return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+slide),t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d);
}

/* ================== INPUT: KEYBOARD + MOUSE ================== */
const keys={},mouse={x:W/2,y:H/2-100,down:false};
let touchMode=matchMedia('(pointer:coarse)').matches,useMouse=!touchMode;
addEventListener('keydown',e=>{
  unlockAudio();keys[e.code]=true;
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
  if(e.code==='Space'&&!e.repeat)throwG();
  if(e.code==='Enter'&&state!=='play'&&canRestart())start();
});
addEventListener('keyup',e=>keys[e.code]=false);
cv.addEventListener('mousemove',e=>{const r=cv.getBoundingClientRect();mouse.x=(e.clientX-r.left)*W/r.width;mouse.y=(e.clientY-r.top)*H/r.height;useMouse=true;touchMode=false;});
cv.addEventListener('mousedown',e=>{unlockAudio();if(state!=='play'){if(canRestart())start();return;}if(e.button===2)throwG();else mouse.down=true;});
addEventListener('mouseup',e=>{if(e.button===0)mouse.down=false;});
cv.addEventListener('contextmenu',e=>e.preventDefault());

/* ================== INPUT: TOUCH (left = move/aim stick, right = fire) ================== */
const STICK_R=52,DEAD=.18;
let moveStick=null,fireId=null,gPress=0;
const GBTN={x:W-54,y:H-210,r:30};
const FBTN={x:W-90,y:H-96,r:52};
function tpos(t){const r=cv.getBoundingClientRect();return{x:(t.clientX-r.left)*W/r.width,y:(t.clientY-r.top)*H/r.height};}
function stickVec(s){
  if(!s)return null;
  const dx=s.x-s.ox,dy=s.y-s.oy,d=Math.hypot(dx,dy);
  if(d<STICK_R*DEAD)return{x:0,y:0,m:0};
  const m=Math.min(1,d/STICK_R);return{x:dx/d*m,y:dy/d*m,m};
}
function releaseTouch(){moveStick=null;fireId=null;}
document.addEventListener('touchstart',e=>{
  e.preventDefault();unlockAudio();
  touchMode=true;useMouse=false;mouse.down=false;
  if(state!=='play'){if(canRestart())start();return;}
  for(const t of e.changedTouches){
    const p=tpos(t);
    if(Math.hypot(p.x-GBTN.x,p.y-GBTN.y)<GBTN.r+10){throwG();gPress=10;continue;}
    if(p.x<W/2){if(!moveStick)moveStick={id:t.identifier,ox:p.x,oy:p.y,x:p.x,y:p.y};}
    else if(fireId===null)fireId=t.identifier; // right half = hold to fire
  }
},{passive:false});
document.addEventListener('touchmove',e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    const s=moveStick;if(!s||s.id!==t.identifier)continue;
    const p=tpos(t);s.x=p.x;s.y=p.y;
    const dx=s.x-s.ox,dy=s.y-s.oy,d=Math.hypot(dx,dy);
    if(d>STICK_R){s.ox=s.x-dx/d*STICK_R;s.oy=s.y-dy/d*STICK_R;} // base trails the thumb
  }
},{passive:false});
function endTouch(e){
  e.preventDefault();unlockAudio();
  for(const t of e.changedTouches){
    if(moveStick&&moveStick.id===t.identifier)moveStick=null;
    if(fireId===t.identifier)fireId=null;
  }
}
document.addEventListener('touchend',endTouch,{passive:false});
document.addEventListener('touchcancel',endTouch,{passive:false});
addEventListener('blur',()=>{releaseTouch();mouse.down=false;for(const k in keys)keys[k]=false;});
document.addEventListener('visibilitychange',()=>{if(document.hidden){releaseTouch();mouse.down=false;}});

/* ================== SETUP / GENERATION ================== */
function start(){
  unlockAudio();
  P={x:W/2,y:0,r:10,ang:-Math.PI/2,lives:3,inv:120,cd:0,wpn:'RIFLE',ammo:0,gren:5,frags:0,over:0,walk:0};
  bul=[];ebul=[];foes=[];crates=[];walls=[];pick=[];gren=[];parts=[];
  camY=-H+140;genY=-260;score=0;shake=0;boss=null;bossSpawned=false;spawnT=120;winT=0;
  state='play';banner('MISSION START');
}
function seg(top){
  const n=1+(Math.random()*2|0);
  for(let i=0;i<n;i++){const w=rnd(40,100),h=rnd(24,56);
    walls.push({x:rnd(0,W-w),y:top+rnd(0,300-h),w,h,kind:Math.random()<.5?'wall':'bag',hp:8});}
  const nc=1+(Math.random()*2|0);
  for(let i=0;i<nc;i++){const c={x:rnd(16,W-40),y:top+rnd(10,290),w:24,h:24,hp:3};
    if(!walls.some(o=>overlap(c,o)))crates.push(c);}
  if(Math.random()<.3+lvl()*.45){const t=mkTurret(rnd(40,W-40),top+rnd(30,260));
    if(!walls.some(o=>circRect(t.x,t.y,22,o))&&!crates.some(o=>circRect(t.x,t.y,22,o)))foes.push(t);}
}
const mkGrunt=(x,y)=>({type:'grunt',x,y,r:10,hp:2,cd:rnd(60,140),spd:rnd(.8,1.4),ph:Math.random()*6,ang:Math.PI/2,walk:0,flash:0});
const mkTurret=(x,y)=>({type:'turret',x,y,r:16,hp:8,cd:rnd(60,120),ang:Math.PI/2,burst:0,flash:0});
const mkBoss=()=>({type:'boss',x:W/2,y:camY-60,r:44,hp:260,max:260,cd:60,ang:Math.PI/2,t:0,pat:0,entering:true,flash:0});
function spawnGrunt(){
  for(let k=0;k<6;k++){const side=Math.random()<.3;
    const g=mkGrunt(side?(Math.random()<.5?-8:W+8):rnd(20,W-20),side?camY+rnd(60,H*.5):camY-16);
    if(!blocked(g)){foes.push(g);return;}}
}

/* ================== MECHANICS ================== */
function blocked(o){
  for(const w of walls)if(!w.dead&&circRect(o.x,o.y,o.r,w))return true;
  for(const c of crates)if(!c.dead&&circRect(o.x,o.y,o.r,c))return true;
  return false;
}
function moveCirc(o,vx,vy){o.x+=vx;if(blocked(o))o.x-=vx;o.y+=vy;if(blocked(o))o.y-=vy;}
function banner(t){msgTxt=t;msgT=110;}
function saveHi(){hi=Math.max(hi,score);try{localStorage.setItem('ic_hi',hi);}catch(e){}}
function buzz(ms){if(navigator.vibrate)try{navigator.vibrate(ms);}catch(e){}}

function fire(){
  const a=P.ang,gx=P.x+Math.cos(a)*18,gy=P.y+Math.sin(a)*18,w=P.over>0?'OVERCHARGE':P.wpn;
  const shot=(an,s,o)=>bul.push(Object.assign({x:gx,y:gy,vx:Math.cos(an)*s,vy:Math.sin(an)*s,life:60,dmg:1,r:3,pierce:false,col:'#ff6',hits:[]},o));
  if(w==='RIFLE'){shot(a+rnd(-.04,.04),9);sfx(880,.04,'square',.03,-400);}
  else if(w==='SPREAD'){for(const d of[-.22,0,.22])shot(a+d,8,{col:'#6ff'});sfx(660,.06,'square',.03,-300);P.ammo--;}
  else if(w==='FLAME'){shot(a+rnd(-.18,.18),rnd(4,6),{life:24,dmg:.35,r:6,pierce:true,flame:true});sfx(rnd(120,200),.05,'sawtooth',.02);P.ammo--;}
  else{shot(a,11,{dmg:4,r:7,pierce:true,col:'#f0f',life:70});sfx(220,.12,'sawtooth',.05,600);}
  if(P.wpn!=='RIFLE'&&P.ammo<=0){P.wpn='RIFLE';banner('AMMO OUT');}
  P.cd=WEAPONS[w].rate;
}
function eShoot(f,a,s){
  ebul.push({x:f.x+Math.cos(a)*(f.r+4),y:f.y+Math.sin(a)*(f.r+4),vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:4});
  if(f.type!=='boss'||Math.random()<.3)sfx(320,.05,'square',.015,-150);
}
function boom(x,y,n,col){for(let i=0;i<n;i++){const a=rnd(0,6.283),s=rnd(.5,4.5);
  parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(18,40),max:40,col:Math.random()<.4?'#ff8':col,sz:rnd(2,5)});}}
function spark(x,y){for(let i=0;i<3;i++)parts.push({x,y,vx:rnd(-1.5,1.5),vy:rnd(-1.5,1.5),life:8,max:10,col:'#ffd',sz:2});}
function drop(x,y){const r=Math.random();pick.push({x,y,t:r<.3?'C':r<.5?'S':r<.68?'F':r<.92?'G':'L',life:900});}
function breakCrate(c){if(c.dead)return;c.dead=1;boom(c.x+12,c.y+12,12,'#a8743a');sfx(180,.1,'square',.03,-80);score+=50;drop(c.x+12,c.y+12);}

function hurt(f,d){
  f.hp-=d;f.flash=4;
  if(f.hp>0){if(f.type==='boss')sfx(90,.03,'square',.02);return;}
  f.dead=1;
  if(f.type==='boss'){
    score+=5000;winT=200;shake=20;ebul=[];foes.forEach(o=>o.dead=1);buzz([80,60,80,60,200]);
    for(let i=0;i<10;i++)setTimeout(()=>{boom(f.x+rnd(-45,45),f.y+rnd(-35,35),30,'#fa0');shake=12;},i*130);
    sfx(60,1.2,'sawtooth',.08,-40);banner('HEAVY UNIT DESTROYED');return;
  }
  score+=f.type==='turret'?300:100;
  boom(f.x,f.y,f.type==='turret'?26:14,f.type==='turret'?'#fa0':'#f55');
  sfx(140,.18,'sawtooth',.04,-100);
  if((f.type==='grunt'&&Math.random()<.07)||(f.type==='turret'&&Math.random()<.35))drop(f.x,f.y);
}
function hitPlayer(){
  if(P.inv>0||state!=='play')return;
  P.lives--;P.inv=150;boom(P.x,P.y,30,'#9f9');shake=14;ebul=[];P.wpn='RIFLE';
  sfx(100,.5,'sawtooth',.07,-80);buzz(150);
  if(P.lives<0){P.lives=0;state='over';endF=frame;saveHi();releaseTouch();}else banner('LIVES '+P.lives);
}
function throwG(){
  if(state!=='play'||P.gren<=0)return;P.gren--;
  const tx=useMouse?mouse.x:P.x+Math.cos(P.ang)*160,ty=useMouse?mouse.y+camY:P.y+Math.sin(P.ang)*160;
  const a=Math.atan2(ty-P.y,tx-P.x),d=Math.min(200,Math.hypot(tx-P.x,ty-P.y));
  gren.push({sx:P.x,sy:P.y,tx:P.x+Math.cos(a)*d,ty:P.y+Math.sin(a)*d,t:0,T:40});
  sfx(300,.15,'triangle',.04,-200);buzz(20);
}
function explode(x,y){
  boom(x,y,40,'#f80');shake=Math.max(shake,10);sfx(80,.4,'sawtooth',.07,-50);
  const R=72;
  for(const f of foes)if(!f.dead&&Math.hypot(f.x-x,f.y-y)<R+f.r)hurt(f,f.type==='boss'?12:6);
  for(const c of crates)if(!c.dead&&circRect(x,y,R,c))breakCrate(c);
  for(const o of walls)if(!o.dead&&o.kind==='bag'&&circRect(x,y,R,o)){o.dead=1;boom(o.x+o.w/2,o.y+o.h/2,12,'#ca8');}
}
function collect(t){
  sfx(1200,.12,'square',.04,600);
  if(t==='C'){P.frags++;score+=250;
    if(P.frags>=6){P.frags=0;P.over=900;banner('OVERCHARGE ONLINE');sfx(200,.8,'sawtooth',.06,1200);buzz(60);}
    else banner('CORE FRAGMENT '+P.frags+'/6');}
  else if(t==='S'){P.wpn='SPREAD';P.ammo=60;banner('SPREAD GUN');}
  else if(t==='F'){P.wpn='FLAME';P.ammo=160;banner('FLAME UNIT');}
  else if(t==='G'){P.gren+=3;banner('+3 GRENADES');}
  else if(t==='L'){P.lives++;banner('1UP');}
}

/* ================== UPDATE ================== */
function update(){
  frame++;
  if(P.inv>0)P.inv--;
  if(P.over>0&&--P.over===0)banner('OVERCHARGE DEPLETED');
  if(msgT>0)msgT--;
  if(gPress>0)gPress--;

  // movement: keyboard (digital) or left stick (analog – speed scales with push)
  let mx=(keys.KeyD?1:0)-(keys.KeyA?1:0),my=(keys.KeyS?1:0)-(keys.KeyW?1:0);
  if(mx&&my){mx*=.7071;my*=.7071;}
  const mv=stickVec(moveStick);if(mv&&mv.m>0){mx=mv.x;my=mv.y;}

  // aim: arrow keys > mouse > movement direction (touch = face where you move)
  const ax=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0),ay=(keys.ArrowDown?1:0)-(keys.ArrowUp?1:0);
  let firing=mouse.down||fireId!==null;
  if(ax||ay){P.ang=Math.atan2(ay,ax);firing=true;useMouse=false;}
  else if(useMouse)P.ang=Math.atan2(mouse.y+camY-P.y,mouse.x-P.x);
  else if(mx||my)P.ang=Math.atan2(my,mx);

  moveCirc(P,mx*2.4,my*2.4);
  if(mx||my)P.walk+=.3;
  P.x=clamp(P.x,P.r,W-P.r);
  P.y=clamp(P.y,camY+40,camY+H-P.r-4);

  // camera, generation, boss trigger
  if(!boss&&P.y-camY<300)camY=P.y-300;
  while(genY>camY-360&&-genY<BOSS_AT-120){seg(genY-320);genY-=320;}
  if(!bossSpawned&&-camY>=BOSS_AT){bossSpawned=true;boss=mkBoss();foes.push(boss);banner('WARNING: HEAVY UNIT');sfx(110,.6,'sawtooth',.06,-60);}

  if(P.cd>0)P.cd--;
  if(firing&&P.cd<=0)fire();
  if(!boss&&--spawnT<=0){spawnGrunt();spawnT=rnd(70,130)-lvl()*55;}

  // enemies
  for(const f of foes){
    if(f.dead)continue;
    if(f.type!=='boss'&&f.y<camY-80)continue;
    const dx=P.x-f.x,dy=P.y-f.y,d=Math.hypot(dx,dy)||1;
    f.ang=Math.atan2(dy,dx);if(f.flash)f.flash--;
    if(f.type==='grunt'){
      f.ph+=.05;const want=d>150?1:-.4;
      moveCirc(f,(dx/d*want+Math.cos(f.ph)*.6)*f.spd,(dy/d*want)*f.spd);f.walk+=.2;
      if(--f.cd<=0&&d<420&&f.y>camY){eShoot(f,f.ang,3);f.cd=rnd(90,160)-lvl()*50;}
    }else if(f.type==='turret'){
      if(--f.cd<=0){if(f.burst<3){eShoot(f,f.ang+rnd(-.05,.05),3.4);f.burst++;f.cd=10;}else{f.burst=0;f.cd=rnd(90,130);}}
    }else{
      f.t++;
      if(f.entering){f.y+=.8;if(f.y>=camY+120)f.entering=false;}
      else{
        f.x=W/2+Math.sin(f.t*.012)*150;
        if(--f.cd<=0){
          const enraged=f.hp<f.max/2;f.pat++;
          if(f.pat%3===0){for(let i=0;i<16;i++)eShoot(f,i/16*Math.PI*2+f.t*.01,2.4);f.cd=enraged?60:80;}
          else{for(const s of[-.25,0,.25])eShoot(f,f.ang+s,3.6);f.cd=enraged?28:40;}
          if(enraged&&Math.random()<.4)foes.push(mkGrunt(rnd(30,W-30),camY-10));
        }
      }
    }
    if(!(f.type==='boss'&&f.entering)&&d<f.r+P.r-2)hitPlayer();
  }

  // player bullets
  for(const b of bul){
    b.x+=b.vx;b.y+=b.vy;b.life--;
    if(b.flame){b.vx*=.96;b.vy*=.96;b.r+=.25;}
    if(b.life<=0||b.x<-20||b.x>W+20||b.y<camY-40||b.y>camY+H+40){b.dead=1;continue;}
    for(const o of walls){if(o.dead)continue;
      if(circRect(b.x,b.y,b.r*.5,o)){
        if(o.kind==='bag'){o.hp-=b.dmg;if(o.hp<=0){o.dead=1;boom(o.x+o.w/2,o.y+o.h/2,14,'#ca8');score+=20;}}
        else spark(b.x,b.y);
        b.dead=1;break;}}
    if(b.dead)continue;
    for(const c of crates){if(c.dead)continue;
      if(circRect(b.x,b.y,b.r*.5,c)){c.hp-=b.dmg;if(!b.pierce)b.dead=1;if(c.hp<=0)breakCrate(c);if(b.dead)break;}}
    if(b.dead)continue;
    for(const f of foes){if(f.dead||b.hits.includes(f)||(f.type==='boss'&&f.entering))continue;
      if(Math.hypot(f.x-b.x,f.y-b.y)<f.r+b.r){b.hits.push(f);hurt(f,b.dmg);if(!b.pierce){b.dead=1;break;}}}
  }

  // enemy bullets
  for(const b of ebul){
    b.x+=b.vx;b.y+=b.vy;
    if(b.x<-10||b.x>W+10||b.y<camY-20||b.y>camY+H+20){b.dead=1;continue;}
    if(walls.some(o=>!o.dead&&circRect(b.x,b.y,2,o))){b.dead=1;spark(b.x,b.y);continue;}
    if(Math.hypot(b.x-P.x,b.y-P.y)<b.r+P.r-3){b.dead=1;hitPlayer();}
  }

  for(const g of gren)if(++g.t>=g.T){g.dead=1;explode(g.tx,g.ty);}
  for(const p of pick){if(--p.life<=0){p.dead=1;continue;}if(Math.hypot(p.x-P.x,p.y-P.y)<P.r+12){p.dead=1;collect(p.t);}}
  for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vx*=.92;p.vy*=.92;if(--p.life<=0)p.dead=1;}

  const bottom=camY+H+80,alive=o=>!o.dead,onMap=o=>!o.dead&&o.y<bottom;
  bul=bul.filter(alive);ebul=ebul.filter(alive);gren=gren.filter(alive);parts=parts.filter(alive);
  foes=foes.filter(onMap);walls=walls.filter(onMap);crates=crates.filter(onMap);pick=pick.filter(onMap);
  if(winT>0&&--winT===0){state='win';endF=frame;saveHi();releaseTouch();}
}

/* ================== RENDER ================== */
const BIOMES=[['#2f4a22','#36552a','#27401c'],['#7a6a42','#857449','#6c5d39'],['#4a4d52','#53575c','#3f4246'],['#2b2a33','#33323d','#24232b']];
function drawGround(){
  const t0=Math.floor(camY/32);
  for(let ty=t0;ty<t0+22;ty++){
    const z=clamp(Math.floor(-ty*32/1600),0,BIOMES.length-1),B=BIOMES[z];
    for(let tx=0;tx<15;tx++){
      const h=hash(tx,ty);ctx.fillStyle=B[h<.7?0:h<.92?1:2];ctx.fillRect(tx*32,ty*32,32,32);
      if(h>.965){ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(tx*32+16,ty*32+16,10,6,0,0,7);ctx.fill();}
      else if(h<.04&&z===0){ctx.fillStyle='#4f7a34';ctx.fillRect(tx*32+8,ty*32+10,3,8);ctx.fillRect(tx*32+14,ty*32+6,3,12);ctx.fillRect(tx*32+20,ty*32+11,3,7);}
    }
  }
}
function drawWalls(){
  for(const o of walls){
    if(o.kind==='wall'){
      ctx.fillStyle='#1b1d22';ctx.fillRect(o.x+4,o.y+6,o.w,o.h);
      ctx.fillStyle='#5d6270';ctx.fillRect(o.x,o.y,o.w,o.h);
      ctx.fillStyle='#7d8394';ctx.fillRect(o.x,o.y,o.w,5);
      ctx.strokeStyle='#454955';ctx.lineWidth=1;
      for(let x=o.x+16;x<o.x+o.w;x+=16){ctx.beginPath();ctx.moveTo(x,o.y+5);ctx.lineTo(x,o.y+o.h);ctx.stroke();}
    }else{
      ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(o.x+3,o.y+4,o.w,o.h);
      for(let y=o.y;y<o.y+o.h-1;y+=10)for(let x=o.x+(((y-o.y)/10)%2?6:0);x<o.x+o.w-4;x+=12){
        const w=Math.min(12,o.x+o.w-x)-1;ctx.fillStyle='#b39a66';ctx.fillRect(x,y,w,9);ctx.fillStyle='#8f7a4e';ctx.fillRect(x,y+6,w,3);}
    }
  }
  for(const c of crates){
    ctx.fillStyle='#6b4520';ctx.fillRect(c.x,c.y,c.w,c.h);
    ctx.strokeStyle='#a8743a';ctx.lineWidth=2;ctx.strokeRect(c.x+1,c.y+1,c.w-2,c.h-2);
    ctx.beginPath();ctx.moveTo(c.x+3,c.y+3);ctx.lineTo(c.x+c.w-3,c.y+c.h-3);ctx.moveTo(c.x+c.w-3,c.y+3);ctx.lineTo(c.x+3,c.y+c.h-3);ctx.stroke();
  }
}
function drawSoldier(x,y,ang,walk,body,head,flash){
  ctx.save();ctx.translate(x,y);
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(2,5,11,7,0,0,7);ctx.fill();
  ctx.rotate(ang);const s=Math.sin(walk)*4;
  ctx.fillStyle='#222';ctx.fillRect(-6+s,-9,7,4);ctx.fillRect(-6-s,5,7,4);
  ctx.fillStyle=flash?'#fff':body;ctx.fillRect(-7,-7,12,14);
  ctx.fillStyle='#333';ctx.fillRect(4,-2,16,4);
  ctx.fillStyle=flash?'#fff':head;ctx.beginPath();ctx.arc(0,0,6,0,7);ctx.fill();
  ctx.restore();
}
function drawFoe(f){
  if(f.type==='grunt'){drawSoldier(f.x,f.y,f.ang,f.walk,'#8a2c2c','#5a1a1a',f.flash);return;}
  ctx.save();ctx.translate(f.x,f.y);
  if(f.type==='turret'){
    ctx.fillStyle='#2a2c30';ctx.fillRect(-18,-18,36,36);
    ctx.fillStyle=f.flash?'#fff':'#5b616b';ctx.fillRect(-15,-15,30,30);
    ctx.rotate(f.ang);ctx.fillStyle='#222';ctx.fillRect(0,-4,24,8);
    ctx.fillStyle=f.flash?'#fff':'#8a919c';ctx.beginPath();ctx.arc(0,0,10,0,7);ctx.fill();
    ctx.fillStyle=frame%30<15?'#f33':'#600';ctx.fillRect(-3,-3,6,6);
  }else{
    ctx.fillStyle='rgba(0,0,0,.4)';ctx.fillRect(-50,-34,110,84);
    ctx.fillStyle='#1e1f22';ctx.fillRect(-56,-40,18,80);ctx.fillRect(38,-40,18,80);
    ctx.fillStyle='#3a3c40';for(let i=0;i<8;i++){const yy=-40+((i*10+f.t)%80);ctx.fillRect(-56,yy,18,3);ctx.fillRect(38,yy,18,3);}
    ctx.fillStyle=f.flash?'#fff':'#5a4a3a';ctx.fillRect(-40,-36,80,72);
    ctx.fillStyle='#6e5c48';ctx.fillRect(-40,-36,80,8);
    ctx.rotate(f.ang);ctx.fillStyle='#222';ctx.fillRect(10,-12,46,8);ctx.fillRect(10,4,46,8);
    ctx.fillStyle=f.flash?'#fff':'#7a6650';ctx.beginPath();ctx.arc(0,0,24,0,7);ctx.fill();
    ctx.fillStyle=f.hp<f.max/2&&frame%10<5?'#f22':'#a00';ctx.beginPath();ctx.arc(0,0,7,0,7);ctx.fill();
  }
  ctx.restore();
}
function txt(s,x,y,c,sz,al){
  ctx.font='bold '+sz+'px "Courier New",monospace';ctx.textAlign=al;ctx.textBaseline='middle';
  ctx.fillStyle='#000';ctx.fillText(s,x+2,y+2);ctx.fillStyle=c;ctx.fillText(s,x,y);
}
function drawWorld(){
  drawWalls();
  for(const p of pick){
    if(p.life<180&&frame%8<4)continue;
    const[col,lab]=PK[p.t],b=Math.sin(frame*.15+p.x)*2;
    ctx.fillStyle='#000';ctx.fillRect(p.x-11,p.y-11+b,22,22);
    ctx.strokeStyle=col;ctx.lineWidth=2;ctx.strokeRect(p.x-10,p.y-10+b,20,20);
    ctx.fillStyle=col;ctx.font='bold 10px monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(lab,p.x,p.y+1+b);
  }
  for(const f of foes)drawFoe(f);
  if(state==='play'&&!(P.inv>0&&frame%6<3)){
    if(P.over>0){ctx.strokeStyle='rgba(255,0,255,'+(.4+Math.sin(frame*.3)*.3)+')';ctx.lineWidth=3;ctx.beginPath();ctx.arc(P.x,P.y,18+Math.sin(frame*.2)*2,0,7);ctx.stroke();}
    drawSoldier(P.x,P.y,P.ang,P.walk,'#3a8f4a','#d9a066',false);
    if(touchMode){ // facing reticle
      const rx=P.x+Math.cos(P.ang)*46,ry=P.y+Math.sin(P.ang)*46;
      ctx.strokeStyle='rgba(255,255,100,.6)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(rx,ry,5,0,7);ctx.stroke();
    }
  }
  for(const g of gren){
    const k=g.t/g.T,x=g.sx+(g.tx-g.sx)*k,y=g.sy+(g.ty-g.sy)*k,h=Math.sin(Math.PI*k)*40;
    ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(x,y,5,3,0,0,7);ctx.fill();
    ctx.fillStyle='#4a5';ctx.beginPath();ctx.arc(x,y-h,4,0,7);ctx.fill();
  }
  for(const b of bul){
    if(b.flame){ctx.globalAlpha=b.life/24;ctx.fillStyle=b.life>14?'#ff6':b.life>7?'#f80':'#c30';}else ctx.fillStyle=b.col;
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill();ctx.globalAlpha=1;
  }
  for(const b of ebul){
    ctx.fillStyle='#f42';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill();
    ctx.fillStyle='#fec';ctx.beginPath();ctx.arc(b.x,b.y,1.6,0,7);ctx.fill();
  }
  for(const p of parts){ctx.globalAlpha=p.life/p.max;ctx.fillStyle=p.col;ctx.fillRect(p.x-p.sz/2,p.y-p.sz/2,p.sz,p.sz);}
  ctx.globalAlpha=1;
}
function drawHUD(){
  ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,W,46);
  txt('SCORE '+String(score).padStart(7,'0'),8,14,'#ff6',12,'left');
  txt('HI    '+String(Math.max(hi,score)).padStart(7,'0'),8,32,'#999',12,'left');
  txt('LIVES',180,14,'#9f9',11,'left');
  for(let i=0;i<Math.min(P.lives,6);i++){ctx.fillStyle='#3a8f4a';ctx.fillRect(224+i*10,9,7,10);}
  txt('GREN '+P.gren,180,32,'#9f6',11,'left');
  const w=P.over>0?'OVERCHARGE':P.wpn;
  txt(w+(P.over>0||P.wpn==='RIFLE'?'':' '+P.ammo),W-8,14,P.over>0?'#f0f':'#6ff',11,'right');
  txt('CORE',W-114,32,'#f0f',11,'left');
  for(let i=0;i<6;i++){ctx.fillStyle=i<P.frags?'#f0f':'#333';ctx.fillRect(W-74+i*11,27,9,10);}
  if(P.over>0){ctx.fillStyle='#f0f';ctx.fillRect(0,44,W*P.over/900,2);}
  if(!boss){const pr=lvl();ctx.fillStyle='rgba(255,255,255,.15)';ctx.fillRect(W-6,60,3,200);ctx.fillStyle='#ff6';ctx.fillRect(W-8,60+200*(1-pr)-2,7,4);}
  else if(!boss.dead){ctx.fillStyle='#300';ctx.fillRect(40,56,W-80,8);ctx.fillStyle='#f33';ctx.fillRect(40,56,(W-80)*Math.max(0,boss.hp)/boss.max,8);txt('HEAVY UNIT',W/2,74,'#f66',10,'center');}
  if(msgT>0&&(msgT>30||frame%6<3))txt(msgTxt,W/2,H/2-120,'#fff',18,'center');
}
/* --- touch overlay --- */
function drawMoveStick(){
  const s=moveStick,hx=90,hy=H-96;let bx,by,kx,ky;
  if(s){bx=clamp(s.ox,STICK_R+4,W/2-STICK_R);by=clamp(s.oy,STICK_R+60,H-STICK_R-4);kx=bx+(s.x-s.ox);ky=by+(s.y-s.oy);}
  else{bx=kx=hx;by=ky=hy;}
  ctx.globalAlpha=s?.6:.2;
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.arc(bx,by,STICK_R,0,7);ctx.fill();
  ctx.strokeStyle='#9f9';ctx.lineWidth=3;ctx.beginPath();ctx.arc(bx,by,STICK_R,0,7);ctx.stroke();
  ctx.fillStyle='#9f9';ctx.beginPath();ctx.arc(kx,ky,20,0,7);ctx.fill();
  ctx.globalAlpha=1;
  if(!s)txt('MOVE + AIM',hx,hy+STICK_R+12,'rgba(255,255,255,.35)',10,'center');
}
function drawFireBtn(){
  const f=FBTN,on=fireId!==null,pulse=on?Math.sin(frame*.6)*3:0;
  ctx.globalAlpha=on?.8:.3;
  ctx.fillStyle=on?'rgba(255,80,40,.45)':'rgba(0,0,0,.35)';ctx.beginPath();ctx.arc(f.x,f.y,f.r+pulse,0,7);ctx.fill();
  ctx.strokeStyle=on?'#f84':'#ff6';ctx.lineWidth=3;ctx.stroke();
  ctx.globalAlpha=1;
  txt('FIRE',f.x,f.y,on?'#fff':'rgba(255,255,255,.5)',14,'center');
  if(!on)txt('HOLD RIGHT SIDE',f.x,f.y+f.r+12,'rgba(255,255,255,.35)',10,'center');
}
function drawTouch(){
  drawMoveStick();drawFireBtn();
  const g=GBTN,on=P.gren>0;
  ctx.globalAlpha=gPress?.95:.55;
  ctx.fillStyle=gPress?'#5c8':on?'#264':'#333';ctx.beginPath();ctx.arc(g.x,g.y,g.r,0,7);ctx.fill();
  ctx.strokeStyle=on?'#9f6':'#666';ctx.lineWidth=3;ctx.stroke();ctx.globalAlpha=1;
  txt('G',g.x,g.y-6,'#fff',16,'center');txt(String(P.gren),g.x,g.y+11,on?'#9f6':'#888',11,'center');
}
function drawScreen(){
  ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,W,H);
  const go=touchMode?'TAP TO START':'CLICK OR PRESS ENTER';
  if(state==='title'){
    txt('IRON',W/2,160,'#f0f',56,'center');txt('CONDUIT',W/2,216,'#6ff',48,'center');
    txt('AN ORIGINAL 80s RUN & GUN',W/2,262,'#ff6',12,'center');
    const help=touchMode
      ?['LEFT THUMB ...... MOVE + AIM','RIGHT THUMB ..... HOLD TO FIRE','G BUTTON ........ GRENADE','','YOU FIRE THE WAY YOU FACE','','SMASH CRATES, GRAB 6 CORE','FRAGMENTS = OVERCHARGE']
      :['WASD ........ MOVE','MOUSE ....... AIM','CLICK ....... FIRE','ARROWS ...... AIM + FIRE','SPACE / RMB . GRENADE','','SMASH CRATES, GRAB 6 CORE','FRAGMENTS = OVERCHARGE'];
    help.forEach((s,i)=>txt(s,W/2,320+i*20,'#9f9',13,'center'));
    if(frame%60<40)txt(go,W/2,530,'#fff',16,'center');
  }else{
    const win=state==='win';
    txt(win?'MISSION COMPLETE':'GAME OVER',W/2,250,win?'#6f6':'#f44',32,'center');
    txt('SCORE '+score,W/2,300,'#ff6',18,'center');txt('HI '+hi,W/2,330,'#999',14,'center');
    if(canRestart()&&frame%60<40)txt(touchMode?'TAP TO RESTART':go,W/2,420,'#fff',16,'center');
  }
}
function draw(){
  if(state==='title')camY=-frame*1.2;
  ctx.save();
  let sx=0,sy=0;if(shake>0){sx=rnd(-shake,shake);sy=rnd(-shake,shake);shake*=.88;if(shake<.4)shake=0;}
  ctx.translate(Math.round(sx),Math.round(sy-camY));
  drawGround();
  if(state!=='title')drawWorld();
  ctx.restore();
  if(state!=='title')drawHUD();
  if(state==='play'&&touchMode)drawTouch();
  if(state!=='play')drawScreen();
}

/* ================== LOOP (fixed 60 Hz) ================== */
let last=performance.now(),acc=0;const STEP=1000/60;
function loop(t){
  acc+=Math.min(100,t-last);last=t;
  while(acc>=STEP){if(state==='play')update();else frame++;acc-=STEP;}
  draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
